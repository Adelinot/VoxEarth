<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoxEarth</title>

    <meta name="description" content="VoxEarth — A voxel recreation of Earth.">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-overlay"></div>

    <header class="hero">

        <img src="assets/logo.png" class="logo">

        <h1>VOXEARTH</h1>

        <p class="subtitle">
            A voxel recreation of the real Earth.
        </p>

        <a href="#game-section" class="play-button">
            PLAY ALPHA
        </a>

    </header>


    <section id="game-section" class="game-section">

        <h2>Play</h2>

        <div class="game-container">
            <iframe
                src="game/index.html"
                allowfullscreen
                loading="lazy">
            </iframe>
        </div>

    </section>


    <section class="features-section">

        <h2>Features</h2>

        <div class="features-grid">

            <div class="feature-card">
                <h3>🌍 Infinite Earth</h3>
                <p>
                    Explore a massive voxel world inspired by real Earth.
                </p>
            </div>

            <div class="feature-card">
                <h3>☀️ Realistic Lighting</h3>
</html>
